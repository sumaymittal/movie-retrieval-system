<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A hybrid movie search engine using BM25 and semantic embeddings with Reciprocal Rank Fusion.">
    <title>CineRAG | Movie Retrieval System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-elements">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <main class="container">
        <header class="hero">
            <h1 class="title">Cine<span class="gradient-text">RAG</span></h1>
            <p class="subtitle">AI-Powered Hybrid Movie Search & Retrieval</p>
        </header>

        <div class="search-container glass-panel">
            <div class="search-tabs">
                <button class="tab-btn active" data-mode="search">Standard Search</button>
                <button class="tab-btn" data-mode="rag">Ask AI (RAG)</button>
            </div>
            
            <form id="searchForm" class="search-form">
                <div class="input-wrapper">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchInput" placeholder="Search for a movie, plot, or ask a question..." required autocomplete="off">
                    <button type="submit" id="submitBtn" class="primary-btn">
                        <span>Search</span>
                        <div class="loader hidden"></div>
                    </button>
                </div>
            </form>
        </div>

        <div id="resultsArea" class="results-area hidden">
            <!-- RAG Answer Section -->
            <div id="ragAnswerSection" class="rag-section glass-panel hidden">
                <div class="rag-header">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#3b82f6" /><stop offset="100%" style="stop-color:#8b5cf6" /></linearGradient></defs><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                    <h2>AI Response</h2>
                </div>
                <div id="ragAnswerContent" class="rag-content"></div>
                <div class="rag-sources">
                    <h3>Sources Cited:</h3>
                    <ul id="ragSourcesList"></ul>
                </div>
            </div>

            <!-- Standard Results Section -->
            <div id="standardResultsSection" class="results-grid hidden">
                <!-- Results will be injected here -->
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
