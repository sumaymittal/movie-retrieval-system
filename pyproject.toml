[project]
name = "movie-retrieval-system"
version = "1.0.0"
description = "A movie information retrieval system using hybrid search (BM25 + Semantic), RAG, and LLM-powered query enhancement and reranking."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Sumay Mittal", email = "mittalsumay@gmail.com" }
]
dependencies = [
    "coverage>=7.13.2",
    "google-genai>=1.62.0",
    "nltk==3.9.1",
    "numpy>=2.4.1",
    "pillow>=12.1.0",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "sentence-transformers>=5.2.2",
]
